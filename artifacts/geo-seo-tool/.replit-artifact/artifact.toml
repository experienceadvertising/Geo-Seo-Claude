kind = "web"
previewPath = "/"
title = "GEO SEO Analyzer"
version = "1.0.0"
id = "artifacts/geo-seo-tool"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23723

[services.development]
run = "pnpm --filter @workspace/geo-seo-tool run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/geo-seo-tool", "run", "build" ]
publicDir = "artifacts/geo-seo-tool/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23723"
BASE_PATH = "/"
