openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: geo
    description: GEO SEO analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /geo/analyze:
    post:
      operationId: analyzeUrl
      tags: [geo]
      summary: Run a full GEO+SEO analysis on a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeUrlBody"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoAuditResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /geo/audits:
    get:
      operationId: listAudits
      tags: [geo]
      summary: List recent audits
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of audits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditSummary"

  /geo/audits/{id}:
    get:
      operationId: getAudit
      tags: [geo]
      summary: Get a specific audit by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoAuditResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /geo/prompts/suggest:
    post:
      operationId: suggestPrompts
      tags: [geo]
      summary: Generate suggested prompts for a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestPromptsBody"
      responses:
        "200":
          description: Suggested prompts
          content:
            application/json:
              schema:
                type: object
                properties:
                  prompts:
                    type: array
                    items:
                      type: string
                required:
                  - prompts

  /geo/simulate:
    post:
      operationId: runSimulation
      tags: [geo]
      summary: Run a prompt simulation across AI engines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunSimulationBody"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSimulationResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /geo/audits/{auditId}/simulation/latest:
    get:
      operationId: getLatestSimulationForAudit
      tags: [geo]
      summary: Get the most recent prompt simulation for an audit
      parameters:
        - in: path
          name: auditId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Latest simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSimulationResult"
        "404":
          description: No simulation found for this audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /geo/simulations/{id}:
    get:
      operationId: getSimulation
      tags: [geo]
      summary: Get a saved prompt simulation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSimulationResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AnalyzeUrlBody:
      type: object
      properties:
        url:
          type: string
          description: URL to analyze
      required:
        - url

    AuditSummary:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        geoScore:
          type: number
        createdAt:
          type: string
      required:
        - id
        - url
        - geoScore
        - createdAt

    CrawlerStatus:
      type: object
      properties:
        name:
          type: string
        allowed:
          type: boolean
        type:
          type: string
      required:
        - name
        - allowed
        - type

    CitabilityBlock:
      type: object
      properties:
        heading:
          type: string
        wordCount:
          type: integer
        score:
          type: number
        grade:
          type: string
        preview:
          type: string
      required:
        - wordCount
        - score
        - grade
        - preview

    SchemaItem:
      type: object
      properties:
        type:
          type: string
        present:
          type: boolean
        properties:
          type: array
          items:
            type: string
      required:
        - type
        - present

    PlatformScore:
      type: object
      properties:
        platform:
          type: string
        score:
          type: number
        status:
          type: string
        recommendations:
          type: array
          items:
            type: string
      required:
        - platform
        - score
        - status
        - recommendations

    GeoAuditResult:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        title:
          type: string
        description:
          type: string
        geoScore:
          type: number
        createdAt:
          type: string
        scores:
          type: object
          properties:
            citability:
              type: number
            brandAuthority:
              type: number
            contentQuality:
              type: number
            technicalSeo:
              type: number
            structuredData:
              type: number
            platformOptimization:
              type: number
          required:
            - citability
            - brandAuthority
            - contentQuality
            - technicalSeo
            - structuredData
            - platformOptimization
        crawlers:
          type: array
          items:
            $ref: "#/components/schemas/CrawlerStatus"
        citabilityBlocks:
          type: array
          items:
            $ref: "#/components/schemas/CitabilityBlock"
        avgCitabilityScore:
          type: number
        schemaTypes:
          type: array
          items:
            $ref: "#/components/schemas/SchemaItem"
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/PlatformScore"
        quickWins:
          type: array
          items:
            type: string
        technicalIssues:
          type: array
          items:
            type: string
        hasLlmsTxt:
          type: boolean
        hasHttps:
          type: boolean
        hasCanonical:
          type: boolean
        wordCount:
          type: integer
        rawHtmlWordCount:
          type: integer
          description: Words visible in the raw HTML response (what AI crawlers without JS see).
        renderedWordCount:
          type: integer
          description: Words visible after JavaScript renders the page (what human users see).
        requiresJavaScript:
          type: boolean
          description: True when the page is a JS-rendered SPA whose content is invisible to non-JS AI crawlers.
        renderedSuccessfully:
          type: boolean
          description: True when the headless browser successfully rendered the page.
        aiInsights:
          type: string
        brandName:
          type: string
        brandSignals:
          type: array
          items:
            $ref: "#/components/schemas/BrandSignal"
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/GeoRecommendation"
        recommendationsSchemaVersion:
          type: string
          enum: [v1]
          nullable: true
          description: |
            Version of the recommendations catalog schema this audit's
            recommendations conform to. "v1" means each recommendation carries
            a structured `source` (and a possibly-null `expectedLift`) and the
            client should render source-attribution badges. `null` means the
            audit was stored before source-tracking was added; the client
            should render recommendations without badges and surface a
            "re-scan to get provenance" notice.
      required:
        - url
        - geoScore
        - createdAt
        - scores
        - crawlers
        - citabilityBlocks
        - avgCitabilityScore
        - schemaTypes
        - platforms
        - quickWins
        - technicalIssues
        - hasLlmsTxt
        - hasHttps
        - hasCanonical
        - wordCount

    GeoRecommendation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        detail:
          type: string
        priority:
          type: string
          enum: [critical, high, medium, low]
        category:
          type: string
          enum: [answerability, authority, structure, depth, freshness, technical, entity]
        impact:
          type: string
        source:
          $ref: "#/components/schemas/RecommendationSource"
        expectedLift:
          allOf:
            - $ref: "#/components/schemas/ExpectedLift"
          nullable: true
          description: |
            Structured quantitative lift claim, sourced from the catalog.
            Explicitly `null` when no defensible precise number exists for this
            recommendation; in that case the qualitative wording in `detail`
            is the only claim made. Absent on legacy audits.
      required:
        - id
        - title
        - detail
        - priority
        - category
        - impact

    RecommendationSource:
      type: object
      description: |
        Source-attribution metadata for a single recommendation, sourced from
        the @workspace/recommendations catalog. Absent on legacy audits stored
        before the catalog existed.
      properties:
        type:
          type: string
          enum: [research, internal_benchmark, practitioner_consensus]
        url:
          type: string
          nullable: true
        citation:
          type: string
        verified:
          type: boolean
        lastVerifiedAt:
          type: string
          nullable: true
          description: ISO date (YYYY-MM-DD) of last human verification, or null when verified=false.
        notes:
          type: string
          description: Editorial notes safe to render in a tooltip / details panel.
      required:
        - type
        - url
        - citation
        - verified
        - lastVerifiedAt

    ExpectedLift:
      type: object
      description: |
        Structured lift claim. `range` represents the source's reported range
        across the categories or prompt classes the source itself reports on
        (e.g. a paper reporting "30.3% on average across prompts, with
        individual prompt categories ranging 18%-47%"). It is NOT a
        statistical confidence interval.
      properties:
        kind:
          type: string
          enum: [percent, multiplier, positions]
        value:
          type: number
        range:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: Source-reported range [min, max]. Not allowed when kind="positions".
      required:
        - kind
        - value

    BrandSignal:
      type: object
      properties:
        source:
          type: string
        found:
          type: boolean
        state:
          type: string
          enum: [found, not_found, unavailable]
        detail:
          type: string
      required:
        - source
        - found
        - state

    SuggestPromptsBody:
      type: object
      properties:
        brandName:
          type: string
        description:
          type: string
      required:
        - brandName

    RunSimulationBody:
      type: object
      properties:
        auditId:
          type: integer
        domain:
          type: string
        brandName:
          type: string
        prompts:
          type: array
          items:
            type: string
        engines:
          type: array
          items:
            type: string
            enum: [chatgpt, claude, gemini, perplexity]
      required:
        - domain
        - brandName
        - prompts

    EngineResult:
      type: object
      properties:
        engine:
          type: string
        engineLabel:
          type: string
        prompt:
          type: string
        responseText:
          type: string
        brandMentioned:
          type: boolean
        brandFirstPosition:
          type: number
          nullable: true
        domainCited:
          type: boolean
        citedUrls:
          type: array
          items:
            type: string
        competitorMentions:
          type: array
          items:
            type: string
        error:
          type: string
          nullable: true
        durationMs:
          type: number
      required:
        - engine
        - engineLabel
        - prompt
        - responseText
        - brandMentioned
        - domainCited
        - citedUrls
        - competitorMentions
        - durationMs

    PromptResultRow:
      type: object
      properties:
        prompt:
          type: string
        engines:
          type: array
          items:
            $ref: "#/components/schemas/EngineResult"
      required:
        - prompt
        - engines

    EngineSummary:
      type: object
      properties:
        engine:
          type: string
        engineLabel:
          type: string
        mentionRate:
          type: number
        citationRate:
          type: number
        avgFirstPosition:
          type: number
          nullable: true
        errorRate:
          type: number
      required:
        - engine
        - engineLabel
        - mentionRate
        - citationRate
        - errorRate

    SimulationSummary:
      type: object
      properties:
        totalPrompts:
          type: integer
        perEngine:
          type: array
          items:
            $ref: "#/components/schemas/EngineSummary"
        topCompetitors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: integer
            required:
              - name
              - count
        overallVisibilityScore:
          type: number
      required:
        - totalPrompts
        - perEngine
        - topCompetitors
        - overallVisibilityScore

    PromptSimulationResult:
      type: object
      properties:
        id:
          type: integer
        auditId:
          type: integer
          nullable: true
        domain:
          type: string
        brandName:
          type: string
        prompts:
          type: array
          items:
            type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/PromptResultRow"
        summary:
          $ref: "#/components/schemas/SimulationSummary"
        createdAt:
          type: string
      required:
        - id
        - domain
        - brandName
        - prompts
        - results
        - summary
        - createdAt
